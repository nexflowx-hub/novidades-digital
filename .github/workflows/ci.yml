name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: https://digital.novidades.store
          XPAYMENTS_API_URL: https://api.xpayments.digital/api/v1
