<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acesso | Novidades Digital</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="access-body">
  <header class="topbar">
    <a class="brand" href="./">NOVIDADES<span>.digital</span></a>
  </header>
  <main class="access-main">
    <section class="access-card">
      <div class="success-mark">✓</div>
      <p class="eyebrow dark">CONVERSION CONTENT OS</p>
      <h1>Validando a sua compra.</h1>
      <p class="lead dark-text">O acesso é liberado apenas após a confirmação assinada do XPayments.</p>
      <div id="access-status" class="status-box">
        <span class="spinner" aria-hidden="true"></span>
        <div><b>Consultando pagamento</b><p>Aguarde enquanto validamos o entitlement.</p></div>
      </div>
      <div id="download-list" class="download-list" hidden></div>
      <p id="access-error" class="error" hidden></p>
      <a class="button secondary" href="./">Voltar ao produto</a>
    </section>
  </main>
  <script src="./access.js" defer></script>
</body>
</html>
