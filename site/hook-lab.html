<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hook Lab Beta | Novidades Digital</title>
  <meta name="description" content="Gerador determinístico de estruturas de hooks baseado em Relevância, Clareza e Prova.">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">NOVIDADES<span>.digital</span></a>
    <nav><a href="./">Conversion Content OS</a></nav>
  </header>
  <main class="section lab-page">
    <div class="section-head">
      <p class="eyebrow dark">CONVERSION CONTENT OS</p>
      <h1>Hook Lab Beta</h1>
      <p>Estruturas determinísticas para explorar ângulos sem inventar prova. Não é previsão de performance.</p>
    </div>
    <div class="lab-grid">
      <form id="hook-form" class="lab-form">
        <label>Produto ou oferta<textarea name="product">Conversion Content OS</textarea></label>
        <label>Público<textarea name="audience">criadores, ecommerce e pequenas equipas de marketing</textarea></label>
        <label>Resultado desejado<textarea name="outcome">mensagens mais claras e testáveis</textarea></label>
        <label>Próxima ação<textarea name="action">avançar para a oferta</textarea></label>
        <label>Prova disponível<textarea name="proof" placeholder="Opcional"></textarea></label>
        <button class="button primary" type="submit">Gerar estruturas</button>
      </form>
      <div id="hook-results" class="hook-results empty-state">Preencha o briefing e gere a primeira bateria de hooks.</div>
    </div>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
